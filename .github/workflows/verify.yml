name: Verificar frontend

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Leer el pin del contrato
              id: contract
              shell: bash
              run: echo "commit=$(git ls-tree HEAD contract | awk '{print $3}')" >> "$GITHUB_OUTPUT"

            # Clave exclusiva y de solo lectura del contrato privado.
            - name: Traer el contrato fijado por el frontend
              uses: actions/checkout@v5
              with:
                  repository: Luis-David-Echeverria/flu3nce-contract
                  ref: ${{ steps.contract.outputs.commit }}
                  path: contract
                  fetch-depth: 0
                  ssh-key: ${{ secrets.CONTRACT_READ_SSH_KEY }}
                  persist-credentials: false

            - uses: actions/setup-node@v5
              with:
                  node-version: "22"
                  cache: npm

            - run: npm ci
            - run: npm run verify:production

    # Recorridos en navegador real sobre dev:mock (claro, oscuro y 390 px).
    # Prueban la interfaz; no sustituyen probar contra el API real.
    navegador:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v5
              with:
                  node-version: "22"
                  cache: npm

            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e

            - name: Guardar capturas y reporte
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: pruebas-en-navegador
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
